services:
  # The "Movie Storage Server" from the architecture diagram. Runs entirely on
  # its own — the cache server (../cacheserver) reaches it over the network,
  # never bundled into the same compose project. Locally that means "the host
  # machine's published ports"; on the real deployment it means "a separate
  # VPS's address" — same image and config either way.
  minio:
    image: minio/minio:latest
    # Without this, a crash or host reboot leaves the service down until
    # someone notices and starts it by hand.
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-myanflix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in storage-server/.env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3002}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    # MinIO's own liveness endpoint (no credentials needed; curl is in the
    # image). A failing check marks the container "unhealthy" in `docker
    # compose ps`; Docker does not restart it for that (../backend/DOCKER.md,
    # "Health checks").
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Keep at most 5 files of 50 MB of container log (same cap as the cache
    # server) instead of letting it grow until the disk fills.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      # Where the object store physically lives.
      #
      # Unset — production, CI, a fresh clone — this resolves to the
      # `minio-data` named volume declared at the bottom of this file, which is
      # the long-standing behaviour and needs no configuration anywhere.
      #
      # Set to an absolute host path it becomes a bind mount instead, which is
      # how a local machine keeps a multi-GB library on an external drive
      # rather than inside Docker's VM disk image. Compose's short volume
      # syntax accepts either a volume name or a host path in this position,
      # which is what lets ONE variable switch between them — Compose has no
      # conditionals, so the value itself has to carry the choice.
      #
      # The two are separate stores: changing this does not migrate anything.
      # If the path is missing at startup Docker silently creates an empty
      # directory there and MinIO comes up with an empty bucket — mount the
      # drive first.
      - ${MINIO_DATA_PATH:-minio-data}:/data

  # Write-side proxy for direct browser->MinIO uploads (presigned multipart
  # + presigned single-PUT for small files — see backend's
  # MultipartUploadService). MinIO's own port is never exposed to the
  # public internet directly; this is the one thing that is. Deliberately a
  # separate proxy from ../cacheserver's read-side one — different
  # buffering/caching/body-size needs (see upload-proxy/templates), not just
  # a different port on the same config.
  upload-proxy:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      # Local: reaches this same compose project's minio service directly.
      # Real deployment: same address the backend's own MINIO_ENDPOINT
      # already uses to reach MinIO server-side — nothing else changes.
      STORAGE_ORIGIN: ${STORAGE_ORIGIN:-minio:9000}
    ports:
      - "${UPLOAD_PROXY_PORT:-8443}:8443"
    # Same two checks as the cache server: the rendered config still parses
    # and the server answers on its port. GET / is answered 403 by nginx
    # itself (never forwarded to MinIO), and any HTTP answer counts as alive.
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q && curl -sS -o /dev/null http://127.0.0.1:8443/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ./upload-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./upload-proxy/templates:/etc/nginx/templates:ro
    depends_on:
      - minio

volumes:
  minio-data:
