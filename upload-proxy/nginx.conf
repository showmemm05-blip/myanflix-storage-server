worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # $uri, not $request: $request is the full request line INCLUDING the
    # query string, and a presigned upload URL carries X-Amz-Credential
    # (the access key id) and X-Amz-Signature in that query string. Logging
    # it would leave a replayable, still-valid upload URL in every log line
    # (security audit 2026-10-06, M-25). $uri is the path only.
    log_format upload_log '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status '
                           'bytes_in=$request_length bytes_out=$body_bytes_sent rt=$request_time';

    access_log /dev/stdout upload_log;
    error_log /dev/stderr warn;

    # Populated from templates/default.conf.template — the nginx image's
    # entrypoint envsubst's ${STORAGE_ORIGIN} in there from this container's
    # environment (see docker-compose.yml), matching ../cacheserver's own
    # read-side proxy pattern.
    include /etc/nginx/conf.d/*.conf;
}
